services:
  mongodb:
    image: mongo:8.2.12-noble
    hostname: mongodb
    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all
      - --oplogSize
      - '128'
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --host localhost:27017 --quiet --eval
          "quit(db.adminCommand({ hello: 1 }).isWritablePrimary ? 0 : 1)"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend

  mongodb-init:
    image: mongo:8.2.12-noble
    depends_on:
      mongodb:
        condition: service_started
    entrypoint:
      - /bin/bash
      - -ec
      - |
        until mongosh --host mongodb:27017 --quiet --eval \
          "quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)"; do
          sleep 2
        done
        exec mongosh --host mongodb:27017 --quiet \
          --file /scripts/init-replica-set.js
    volumes:
      - ./mongodb/init-replica-set.js:/scripts/init-replica-set.js:ro
    restart: 'no'
    networks:
      - backend

  rabbitmq:
    build:
      context: ./rabbitmq
    hostname: rabbitmq
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - backend

  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    networks:
      - backend

  call-requests-service:
    build:
      context: ..
      dockerfile: scripts/services/Dockerfile
      args:
        APP: call-requests-service
    environment:
      PORT: 3001
      MONGODB_URI: mongodb://mongodb:27017/call_requests?replicaSet=rs0&directConnection=true
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-reservation}:${RABBITMQ_DEFAULT_PASS:-reservation}@rabbitmq:5672/${RABBITMQ_DEFAULT_VHOST:-call-reservation}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS:-3600}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4200}
    depends_on:
      mongodb-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend

  scheduler-service:
    build:
      context: ..
      dockerfile: scripts/services/Dockerfile
      args:
        APP: scheduler-service
    environment:
      PORT: 3003
      MONGODB_URI: mongodb://mongodb:27017/scheduler?replicaSet=rs0&directConnection=true
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-reservation}:${RABBITMQ_DEFAULT_PASS:-reservation}@rabbitmq:5672/${RABBITMQ_DEFAULT_VHOST:-call-reservation}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@call-reservation.local}
    depends_on:
      mongodb-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend

  communication-service:
    build:
      context: ..
      dockerfile: scripts/services/Dockerfile
      args:
        APP: communication-service
    environment:
      PORT: 3002
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-reservation}:${RABBITMQ_DEFAULT_PASS:-reservation}@rabbitmq:5672/${RABBITMQ_DEFAULT_VHOST:-call-reservation}
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_SECURE: 'false'
      SMTP_FROM: ${SMTP_FROM:-no-reply@call-reservation.local}
    depends_on:
      rabbitmq:
        condition: service_healthy
      mailhog:
        condition: service_started
    restart: unless-stopped
    networks:
      - backend

  web-service:
    build:
      context: ..
      dockerfile: scripts/web-service/Dockerfile
      args:
        VITE_CALL_REQUESTS_API_URL: http://localhost:${CALL_REQUESTS_SERVICE_PORT:-3001}/call-request-service
    depends_on:
      - call-requests-service
    restart: unless-stopped
    networks:
      - backend

volumes:
  mongodb-data:
  rabbitmq-data:

networks:
  backend:
    driver: bridge
